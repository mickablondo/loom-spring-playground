spring.application.name=loom-spring-playground
spring.threads.virtual.enabled=true
loom.thread.create.tempo=0
loom.thread.life.tempo=3000
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Spring Boot playground for Java virtual threads and Project Loom
info.app.java-version=21
